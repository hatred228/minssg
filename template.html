<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - MinSSG</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-heading: #58a6ff;
            --accent-color: #2ea043;
            --code-bg: #1f242c;
            --sidebar-width: 260px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
        }
        nav.sidebar {
            width: var(--sidebar-width);
            background: var(--surface-color);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
            position: fixed;
            top: 0; bottom: 0; left: 0;
            overflow-y: auto;
        }
        nav.sidebar .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 24px;
            display: block;
            text-decoration: none;
        }
        nav.sidebar ul { list-style: none; }
        nav.sidebar li { margin-bottom: 8px; }
        nav.sidebar a {
            color: var(--text-primary);
            text-decoration: none;
            display: block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.15s ease;
        }
        nav.sidebar a:hover, nav.sidebar a.active {
            background: rgba(88, 166, 255, 0.15);
            color: var(--text-heading);
        }
        main.content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 40px 60px;
            max-width: 900px;
        }
        h1, h2, h3, h4 { color: #f0f6fc; margin: 24px 0 12px 0; }
        h1 { font-size: 2.2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        h2 { font-size: 1.6rem; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        p { margin-bottom: 16px; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        ul, ol { margin: 0 0 16px 24px; }
        li { margin-bottom: 4px; }
        code {
            font-family: Consolas, "Fira Code", monospace;
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #ff7b72;
        }
        pre {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
        }
        pre code {
            background: transparent;
            padding: 0;
            color: #e6edf3;
            font-size: 0.95em;
        }
        blockquote {
            border-left: 4px solid var(--text-heading);
            padding-left: 16px;
            color: #8b949e;
            margin-bottom: 16px;
        }
        footer {
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            color: #8b949e;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <a class="logo" href="index.html">⚡ MinSSG</a>
        <ul>
            {{ nav_links }}
        </ul>
    </nav>
    <main class="content">
        {{ content }}
        <footer>
            Generated by <strong>MinSSG</strong> • Fast static documentation site generator.
        </footer>
    </main>
</body>
</html>
